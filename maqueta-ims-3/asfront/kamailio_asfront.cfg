#!KAMAILIO
#
# AS Frontera (kamailio_asfront.cfg)
# Frontera de Application Server en la interfaz ISC hacia el Core IMS:
#   - recibe los INVITE/SUBSCRIBE ISC reenviados por el S-CSCF (iFC -> sip:asfront...:5060)
#   - "interworking" ISC -> SIP plano: limpia cabeceras del core y re-origina
#     hacia el AS aplicación (FreeSWITCH: IVR 0100002 / VMS 0100003)
#   - patrón Frontera liviana / relay controlado (sin BD, sin dialplan propio)
#   - TM gestiona el ciclo de vida de la transacción (INVITE -> 200/6xx -> ACK)

####### Valores definidos #######

####### Configuración global #######
include_file "asfront.cfg"

debug=2
log_stderror=yes
sip_warning=no

alias=HOSTNAME

user_agent_header="User-Agent: Kamailio AS-Frontera"
server_header="Server: Kamailio AS-Frontera"
log_name="asfront"
log_prefix_mode=1
log_prefix="{$mt $hdr(CSeq) $ci} "

auto_aliases=no
check_via=no
dns=no
rev_dns=no

####### Módulos #######
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "siputils.so"

modparam("tm", "fr_timer", 2000)
modparam("tm", "fr_inv_timer", 4000)

####### Rutas #######
request_route {

	# Solo aceptamos señalización del Core IMS (el S-CSCF reenvía aquí el
	# INVITE ISC; las respuestas las maneja TM). Nada del plano público.
	if (src_ip != SCSCF_IP) {
		xlog("L_WARN", "AS-Front: rechazado origen no autorizado $si:$sp\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	if (is_method("REGISTER")) {
		xlog("L_WARN", "AS-Front: REGISTER no permitido en la Frontera\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}

	# --- Llegada desde el S-CSCF (servicio ISC) ---
	# INVITE: IVR/VMS. SUBSCRIBE (Event: message-summary): MWI del buzón
	# (TS 24.606); el NOTIFY vuelve por el route set del diálogo (S-CSCF, P-CSCF).
	if (is_method("INVITE|SUBSCRIBE") && !has_totag()) {
		xlog("L_INFO", "AS-Front: $rm ISC desde S-CSCF $si:$sp -> R-URI $ru (origen $fU, destino $rU)\n");

		# Identidad de red troncal: el S-CSCF ya la validó (P-Asserted-Identity).
		if (!search("^P-Asserted-Identity:")) {
			append_hf("P-Asserted-Identity: <sip:$fU@$fd>\r\n");
			xlog("L_DBG", "AS-Front: P-Asserted-Identity añadido para $fU\n");
		}

		# Interworking: no propagamos cabeceras ISC/charging al plano SIP plano.
		remove_hf("P-Charging-Vector");
		remove_hf("P-Served-User");

		# Re-originar hacia el AS aplicación (FreeSWITCH) en SIP plano.
		$du = "sip:FREESWITCH_IP:5060";
		xlog("L_INFO", "AS-Front: re-origina a FreeSWITCH ($du)\n");
		t_relay();
		exit;
	}

	# Para in-dialog / respuestas: TM gestiona el ciclo de vida de la transacción
	# (INVITE + sus respuestas). No es necesario relay explícito aquí; el ACK
	# y otros mensajes del mismo diálogo viajan directamente al AS (FreeSWITCH)
	# a través de la ruta establecida por el S-CSCF/Contact.
	if (is_method("ACK|BYE|CANCEL|UPDATE")) {
		t_relay();
		exit;
	}

	# Salidas inesperadas serán rechazadas (la Frontera no diala números).
	sl_send_reply("403", "Forbidden");
	exit;
}