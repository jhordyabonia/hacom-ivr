global
    log stdout format raw local0
    maxconn 1000

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 5s
    timeout client 10m
    timeout server 10m

backend docker_socket
    server dockersocket /var/run/docker.sock

frontend docker_api
    bind 0.0.0.0:2375

    acl api_version path_reg -i ^(/v[0-9.]+)?/(version|_ping)$
    acl containers_list path_reg -i ^(/v[0-9.]+)?/containers/json$
    acl container_read path_reg -i ^(/v[0-9.]+)?/containers/[^/]+/(json|logs)$
    acl image_read path_reg -i ^(/v[0-9.]+)?/images/[^/]+/json$
    acl container_exec path_reg -i ^(/v[0-9.]+)?/containers/[^/]+/exec$
    acl exec_start path_reg -i ^(/v[0-9.]+)?/exec/[^/]+/start$
    acl exec_inspect path_reg -i ^(/v[0-9.]+)?/exec/[^/]+/json$
    acl container_archive path_reg -i ^(/v[0-9.]+)?/containers/[^/]+/archive$
    acl is_get method GET
    acl is_post method POST
    acl is_put method PUT

    http-request allow if is_get api_version
    http-request allow if is_get containers_list
    http-request allow if is_get container_read
    http-request allow if is_get image_read
    http-request allow if is_get exec_inspect
    http-request allow if is_post container_exec
    http-request allow if is_post exec_start
    http-request allow if is_put container_archive
    http-request deny

    default_backend docker_socket
