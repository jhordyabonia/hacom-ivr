services:
  dns:
    build: !reset null
    container_name: !reset null
    restart: !reset null
    depends_on: !reset []
    env_file:
      - .env.swarm
    dns: !reset []
    volumes:
      - /home/administrator/maqueta-ims-3/dns:/mnt/dns
    networks:
      default:
        ipv4_address: !reset null
        aliases:
          - dns
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.role == core-ims

  redis:
    container_name: !reset null
    networks:
      default:
        ipv4_address: !reset null
        aliases:
          - redis
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.role == database

  mysql:
    build: !reset null
    container_name: !reset null
    restart: !reset null
    depends_on: !reset []
    env_file:
      - .env.swarm
    networks:
      default:
        ipv4_address: !reset null
        aliases:
          - mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.labels.role == database

  rtpengine:
    build: !reset null
    container_name: !reset null
    restart: !reset null
    depends_on: !reset []
    env_file:
      - .env.swarm
    volumes:
      - /home/administrator/maqueta-ims-3/rtpengine:/mnt/rtpengine
    networks:
      default:
        ipv4_address: !reset null
        aliases:
          - rtpengine
    # Pool RTP de la interfaz "ext" (RTP_EXT_PORT_MIN..MAX de .env.swarm).
    ports:
      - {target: 49900, published: 49900, protocol: udp, mode: host}
      - {target: 49901, published: 49901, protocol: udp, mode: host}
      - {target: 49902, published: 49902, protocol: udp, mode: host}
